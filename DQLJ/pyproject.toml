[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yard-machine-motion"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic>=2", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
packages = ["yard_motion"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
