<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>黄骅 8000 t/h 装船机 · SL15</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "three/addons/": "/vendor/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="viewer" aria-label="SL15 装船机三维视图">
        <div id="scene-root" class="scene-root"></div>
        <div class="viewer-toolbar" id="view-buttons" aria-label="固定视角">
          <button type="button" data-view="perspective" aria-pressed="true">透视</button>
          <button type="button" data-view="front" aria-pressed="false">主视</button>
          <button type="button" data-view="side" aria-pressed="false">侧视</button>
          <button type="button" data-view="top" aria-pressed="false">俯视</button>
        </div>
        <div id="view-status" class="view-status">Loading</div>
      </section>

      <aside class="control-panel" aria-label="仿真控制">
        <header class="panel-header">
          <div>
            <h1>黄骅装船机</h1>
            <span id="model-badge" class="model-badge">SL15</span>
          </div>
          <p id="sim-clock">t=0.0s</p>
        </header>

        <div class="command-row">
          <button id="run-button" type="button">运行</button>
          <button id="pause-button" type="button">暂停</button>
          <button id="reset-button" type="button">复位</button>
        </div>

        <section class="loading-panel" aria-labelledby="loading-panel-title">
          <header class="loading-panel-header">
            <div>
              <p class="loading-kicker">华元503 · 航次2525</p>
              <h2 id="loading-panel-title">一键装船</h2>
            </div>
            <span id="loading-status-badge" class="loading-status-badge" data-status="idle">待开始</span>
          </header>

          <div class="loading-plan-summary">
            <strong id="loading-plan-total">52,100 t</strong>
            <span>三轮 · 12 批 · 演示约 4.5 分钟</span>
          </div>

          <p class="simulation-notice">仿真演示功能，不连接或控制真实 PLC。</p>

          <button id="loading-start-button" class="loading-start-button" type="button">
            一键装船
          </button>

          <div class="loading-actions" aria-label="整船装载任务控制">
            <button id="loading-pause-button" type="button" disabled>暂停</button>
            <button id="loading-resume-button" type="button" disabled>继续</button>
            <button id="loading-cancel-button" type="button" disabled>终止</button>
            <button id="loading-reset-button" type="button" disabled>重置</button>
          </div>

          <div class="loading-progress-block">
            <div class="loading-progress-label">
              <span id="loading-current-label">等待启动配载流程</span>
              <strong id="loading-total-readout">0 / 52,100 t</strong>
            </div>
            <div
              id="loading-total-progress"
              class="loading-progress-track"
              role="progressbar"
              aria-label="整船装载进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <span></span>
            </div>
            <div id="loading-time-readout" class="loading-time-readout">机械 12× · 装载 600×</div>
          </div>

          <div id="loading-hold-progress" class="loading-hold-progress" aria-label="五舱进度"></div>
          <ol id="loading-batch-timeline" class="loading-batch-timeline" aria-label="十二批装载时间线"></ol>
          <div id="loading-message" class="loading-message" role="status" aria-live="polite"></div>
        </section>

        <section class="path-panel" aria-labelledby="path-panel-title">
          <header class="section-header">
            <div>
              <h2 id="path-panel-title">目标点路径规划</h2>
              <p>艏部朝上 · 10 × 8 网格</p>
            </div>
            <span id="path-status-badge" class="path-status-badge">待选择</span>
          </header>

          <div class="path-selectors">
            <label>
              船舶
              <select id="path-vessel-select"></select>
            </label>
            <label>
              舱口
              <select id="path-hold-select"></select>
            </label>
            <label>
              列（艏→艉）
              <input id="path-column-input" type="number" min="1" max="10" value="9">
            </label>
            <label>
              行（左舷→右舷）
              <input id="path-row-input" type="number" min="1" max="8" value="4">
            </label>
          </div>

          <div class="hatch-grid-shell">
            <div class="hatch-grid-bow">艏 · 列 1</div>
            <div class="hatch-grid-row-labels" aria-hidden="true">
              <span>左舷 · 行 1</span>
              <span>行 8 · 右舷</span>
            </div>
            <div id="hatch-grid" class="hatch-grid" role="grid" aria-label="舱口 10 乘 8 网格"></div>
            <div class="hatch-grid-stern">艉 · 列 10</div>
          </div>

          <div class="path-actions">
            <button id="path-preview-button" type="button">预览路径</button>
            <button id="path-start-button" type="button" disabled>开始移动</button>
            <button id="path-pause-button" type="button" disabled>暂停</button>
            <button id="path-resume-button" type="button" disabled>恢复</button>
            <button id="path-cancel-button" type="button" disabled>取消</button>
          </div>

          <div id="path-target-readout" class="path-target-readout">请选择目标网格并预览。</div>
          <ol id="path-stage-list" class="path-stage-list" aria-label="六阶段路径"></ol>
          <div id="path-message" class="path-message" role="status" aria-live="polite"></div>
        </section>

        <section class="axis-panel" id="axis-controls"></section>

        <section class="cover-panel">
          <header class="section-header">
            <h2>舱盖</h2>
            <button id="apply-covers-button" type="button">应用</button>
          </header>
          <div id="cover-controls"></div>
        </section>

        <section class="status-panel">
          <h2>运行状态</h2>
          <dl id="state-readout"></dl>
        </section>

        <details class="scene-editor">
          <summary>场景 JSON</summary>
          <textarea id="scene-json" spellcheck="false"></textarea>
          <button id="apply-scene-button" type="button">应用场景</button>
        </details>
      </aside>
    </main>

    <script type="module" src="/app.js?v=20260728-one-click-loading-r1"></script>
  </body>
</html>
